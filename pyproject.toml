[project]
name = "pgmeta"
version = "0.1.0"
description = "A ligthweight library for getting metadata from Postgres databases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "python-dotenv>=1.0.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "pytest-dotenv>=0.5.2",
]
